<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A221E" />
      <stop offset="50%" stop-color="#0F2F2A" />
      <stop offset="100%" stop-color="#1A4A42" />
    </linearGradient>

    <!-- Gold Foil Gradient -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E5AB" />
      <stop offset="25%" stop-color="#DFC18A" />
      <stop offset="50%" stop-color="#C4A574" />
      <stop offset="75%" stop-color="#B38B50" />
      <stop offset="100%" stop-color="#9A7B4F" />
    </linearGradient>

    <!-- Gold Accent Linear -->
    <linearGradient id="gold-bright" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFEBB3" />
      <stop offset="50%" stop-color="#DFC18A" />
      <stop offset="100%" stop-color="#C4A574" />
    </linearGradient>

    <!-- Soft Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Shield / Square -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)" />
  
  <!-- Outer Gold Border -->
  <rect x="14" y="14" width="484" height="484" rx="116" fill="none" stroke="url(#gold-grad)" stroke-width="6" opacity="0.6" />
  
  <!-- Subtle Inner Border -->
  <rect x="28" y="28" width="456" height="456" rx="104" fill="none" stroke="#A8C5BE" stroke-width="1.5" opacity="0.25" stroke-dasharray="8 6" />

  <!-- CA Monogram & Emblem Group -->
  <g filter="url(#shadow)" transform="translate(0, 0)">
    <!-- Letter 'C' -->
    <path
      d="M 230 150 
         C 150 150, 95 195, 95 260 
         C 95 325, 150 370, 230 370 
         C 265 370, 292 360, 312 346 
         L 295 310 
         C 278 322, 258 330, 230 330 
         C 176 330, 138 298, 138 260 
         C 138 222, 176 190, 230 190 
         C 258 190, 278 198, 295 210 
         L 312 174 
         C 292 160, 265 150, 230 150 Z"
      fill="#FFFFFF"
    />

    <!-- Letter 'A' -->
    <path
      d="M 335 152 
         L 270 368 
         L 312 368 
         L 326 318 
         L 394 318 
         L 408 368 
         L 450 368 
         L 385 152 
         L 335 152 Z 
         M 360 200 
         L 384 282 
         L 336 282 
         Z"
      fill="#FFFFFF"
    />

    <!-- Dynamic Golden Verification Tick / Swash across 'A' -->
    <path
      d="M 285 304 
         L 335 348 
         L 442 225 
         C 445 221, 440 216, 434 220 
         L 332 316 
         L 295 284 
         C 289 279, 281 288, 285 294 
         Z"
      fill="url(#gold-bright)"
      filter="url(#glow)"
    />

    <!-- Top Flourish Dot / Accent -->
    <circle cx="360" cy="120" r="10" fill="url(#gold-grad)" />
    <circle cx="330" cy="122" r="5" fill="url(#gold-grad)" opacity="0.8" />
    <circle cx="390" cy="122" r="5" fill="url(#gold-grad)" opacity="0.8" />
  </g>

  <!-- Bottom Mini Subtitle "CHARTERED ACCOUNTANT" Seal Arc or Ribbon Line -->
  <g transform="translate(256, 422)" text-anchor="middle">
    <path d="M -110 -2 L 110 -2" stroke="url(#gold-grad)" stroke-width="2" opacity="0.7" />
    <text y="18" fill="url(#gold-grad)" font-family="'DM Sans', system-ui, sans-serif" font-size="20" font-weight="700" letter-spacing="6">ACCOUNTANT</text>
  </g>
</svg>
